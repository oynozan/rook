[workspace]
resolver = "2"
members = ["budget", "mock-ft"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
# Size: "z" beats "s" (364 KB) and "3" (380 KB) here; strip drops names and debug sections.
strip = true
