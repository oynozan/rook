# runrook.xyz → the Rook container (127.0.0.1:7888). Install on the server:
#   sudo cp deploy/nginx-runrook.xyz.conf /etc/nginx/sites-available/runrook.xyz
#   sudo ln -s /etc/nginx/sites-available/runrook.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d runrook.xyz     # adds HTTPS to this block and the redirect from http
server {
    listen 80;
    listen [::]:80;
    server_name runrook.xyz;

    location / {
        proxy_pass http://127.0.0.1:7888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # A task's live progress is a server-sent event stream that stays open while it runs: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
